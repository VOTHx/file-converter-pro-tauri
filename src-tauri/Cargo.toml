[package]
name = "file-converter-pro"
version = "0.1.0"
description = "File Converter Pro"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "protocol-asset", "dialog-open", "dialog-save"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
zip = "0.6"
quick-xml = "0.31"
serde_yaml = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Keeps the final .exe as small as possible — this is the whole point of the rewrite.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
